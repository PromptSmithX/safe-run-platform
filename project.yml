name: SafeRun

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.saferun.mvp
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SafeRunDomain:
    path: Packages/SafeRunDomain

targets:
  SafeRunApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS/Sources
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Safe Run
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Safe Run receives the lifecycle of workouts started on the paired Apple Watch for recovery and diagnostics.
    entitlements:
      path: Apps/iOS/SafeRunIOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.ios
        PRODUCT_NAME: SafeRun
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SafeRunDomain
      - target: SafeRunPhoneCore
        embed: true
      - target: SafeRunWatchApp
        embed: true

  SafeRunWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/Watch/Sources
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Safe Run
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.saferun.mvp.ios
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - location
        NSHealthShareUsageDescription: Safe Run reads heart rate during an active workout to show your current running status.
        NSHealthUpdateUsageDescription: Safe Run saves workouts that you explicitly start and stop.
        NSLocationWhenInUseUsageDescription: Safe Run uses your location during an active run to show the latest available position.
    entitlements:
      path: Apps/Watch/SafeRunWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.ios.watchkitapp
        PRODUCT_NAME: SafeRunWatch
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SafeRunDomain
      - target: SafeRunWatchCore
        embed: true

  SafeRunWatchCore:
    type: framework
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/WatchCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.watchcore
        PRODUCT_NAME: SafeRunWatchCore
    dependencies:
      - package: SafeRunDomain
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: WatchConnectivity.framework

  SafeRunPhoneCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/PhoneCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.phonecore
        PRODUCT_NAME: SafeRunPhoneCore
    dependencies:
      - package: SafeRunDomain
      - sdk: WatchConnectivity.framework
      - sdk: HealthKit.framework
      - sdk: libsqlite3.tbd

  SafeRunPhoneCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/PhoneCore/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.phonecore.tests
    dependencies:
      - target: SafeRunPhoneCore
      - package: SafeRunDomain

  SafeRunWatchCoreTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/WatchCore/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saferun.mvp.watchcore.tests
    dependencies:
      - target: SafeRunWatchCore
      - package: SafeRunDomain

schemes:
  SafeRunApp:
    build:
      targets:
        SafeRunApp: all
        SafeRunWatchApp: all
    run:
      config: Debug
    archive:
      config: Release

  SafeRunWatchApp:
    build:
      targets:
        SafeRunWatchApp: all
        SafeRunWatchCore: all
        SafeRunWatchCoreTests: [test]
    test:
      targets:
        - SafeRunWatchCoreTests
    run:
      config: Debug
    archive:
      config: Release

  SafeRunWatchCore:
    build:
      targets:
        SafeRunWatchCore: all
        SafeRunWatchCoreTests: [test]
    test:
      targets:
        - SafeRunWatchCoreTests

  SafeRunPhoneCore:
    build:
      targets:
        SafeRunPhoneCore: all
        SafeRunPhoneCoreTests: [test]
    test:
      targets:
        - SafeRunPhoneCoreTests
